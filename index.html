<!DOCTYPE html>
<html lang="en" data-theme="DARK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AshApp - RPA Project Manager</title>
  <meta name="description" content="Track RPA projects, change requests and deployments in one place.">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- ==================== 3-PANE LAYOUT ==================== -->
  <div id="app-layout">

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
            Projects
          </h2>
          <div class="sidebar-title-actions">
            <button class="btn-icon" id="btn-expand-all" title="Expand All">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
            </button>
            <button class="btn-icon" id="btn-collapse-all" title="Collapse All">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
            </button>
          </div>
        </div>
        <div class="sidebar-search">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="project-search" placeholder="Search projects...">
        </div>
      </div>
      <div class="sidebar-tree" id="project-tree">
        <!-- Tree nodes are rendered by sidebar.js -->
      </div>
    </div>

    <!-- RESIZE HANDLE (sidebar ↔ center) -->
    <div class="resize-handle" id="resize-left"></div>

    <!-- CENTER PANE -->
    <div id="center-pane">
      <div class="center-header" id="center-header">
        <h2 id="center-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Details View
        </h2>
        <div class="center-subtitle" id="center-subtitle">Select an item from the tree</div>
      </div>
      <div class="center-content" id="center-content">
        <!-- Views are rendered by center.js -->
        <div class="empty-state" id="default-view">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg>
          <p>Pick a project or a template node to see its details.</p>
        </div>
      </div>
    </div>

    <!-- RESIZE HANDLE (center ↔ right) -->
    <div class="resize-handle" id="resize-right"></div>

    <!-- RIGHT PANE (Tasks) -->
    <div id="right-pane">
      <div class="right-header">
        <h2>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><polyline points="16 3 16 8 21 8"/></svg>
          Tasks
        </h2>
        <div class="sidebar-search">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="task-search" placeholder="Search tasks...">
        </div>
      </div>
      <div id="task-table-container" class="flex-1 overflow-auto" style="padding: 0 12px;">
        <!-- Task table rendered by tasks.js -->
      </div>
      <div id="task-form-container" style="padding: 12px;">
        <!-- Task form rendered by tasks.js -->
      </div>
    </div>
  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-container">
      <!-- Modal content is rendered dynamically by dialogs.js -->
    </div>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="views/sidebar.js"></script>
  <script src="views/center.js"></script>
  <script src="views/tasks.js"></script>
  <script src="views/dialogs.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
